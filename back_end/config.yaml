data:
  source_dir: "/Users/mbp/Documents/MTECH/Sem4/Individual_project/AI_Assisted_3D_Assembly_Design/AI-Assisted-3D-Assembly-Design/Source_3d_models"
  processed_dir: "data/processed"
  train_ratio: 0.70
  val_ratio:   0.15
  test_ratio:  0.15
  mask_ratio:  [0.20, 0.40]   # fraction of edges masked per graph for partial-graph training
  categories:                  # only scan these subdirectories (null = all)
    - "Mechanical Engineering"
    - "Machine design"
    - "Automotive"
    - "Tools"

model:
  in_dim:     18              # node feature dimension (18-dim: 8 type + vol + exact-SA + 5 affine-invariant shape + SDF-mean + SDF-var + SA/V)
  edge_dim:   2               # edge feature dimension
  hidden_dim: 128
  out_dim:    64
  heads:      [8, 4, 1]       # attention heads per GAT layer
  dropout:    0.2

training:
  batch_size:   32
  epochs:       200
  lr:           1.0e-3
  weight_decay: 5.0e-4
  patience:     20            # early stopping patience
  lr_patience:  8             # ReduceLROnPlateau patience
  lr_factor:    0.5
  neg_ratio:    0.5           # negatives per positive edge (hard negatives via P4 cover the rest)
  n_folds:      5             # K in K-fold cross-validation

evaluation:
  # Phase 1: AUC-ROC and Average Precision only (link prediction)
  # Phase 2: top_k: [1, 3, 5, 10]  for next-component ranking

paths:
  checkpoints:    "checkpoints"
  results:        "results"
  trained_models: "../trained_models"   # timestamped exports saved here
