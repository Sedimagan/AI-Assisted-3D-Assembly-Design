data:
  source_dir: "/Users/mbp/Documents/MTECH/Sem4/Individual_project/AI_Assisted_3D_Assembly_Design/AI-Assisted-3D-Assembly-Design/Source_3d_models/Best_models_for_training"
  processed_dir: "data/processed"
  # Only test_ratio is read (graph_level_indices' fixed test carve-out, in
  # dataset.py). Within the remaining train_val graphs, RandomLinkSplit's
  # per-graph edge split (get_splits(), also in dataset.py) uses hardcoded
  # num_val=0.1/num_test=0.1 rather than reading ratios from here — a
  # train_ratio/val_ratio pair used to sit alongside test_ratio implying
  # they controlled that split too; removed 2026-08 since neither was ever
  # actually read by any code.
  test_ratio:  0.15
  categories:
    - "Bench_vice"
    - "C_Clamps"
    - "Pipe_vice"
    - "Gate_Valve"
    - "Press_Tool"
    - "Tool_Post"
    - "Crane_hook"

model:
  in_dim:     22              # node feature dimension (22-dim: 8 type + log-vol + log-SA + 3 bbox + 5 affine-invariant shape + SDF-mean + SDF-var + SA/V + log-holes)
  edge_dim:   6               # edge feature dimension (2 mate + 4 joint-type one-hot)
  hidden_dim: 128
  out_dim:    64
  heads:      [8, 4, 1]       # attention heads per GAT layer
  dropout:    0.2

training:
  batch_size:   16
  epochs:       200
  lr:           1.0e-3
  weight_decay: 5.0e-4
  patience:     20            # early stopping patience
  lr_patience:  8             # ReduceLROnPlateau patience
  lr_factor:    0.5
  # negatives per positive edge for RandomLinkSplit's val/test edge labels
  # (train_epoch's link_loss adds its own hard-negative term on top, see
  # hard_negative_pairs() in train.py -- unaffected by this value). Was 0.5,
  # meaning positives outnumbered negatives 2:1 in every eval set -- AP is
  # sensitive to that skew (a random scorer's expected AP equals positive
  # prevalence, see evaluate.py's random_ap), so a below-1.0 ratio inflates
  # AP for any model, including a bad one, independent of real ranking
  # skill. 1.0 is the standard link-prediction convention and makes AP
  # numbers comparable to literature baselines; random_ap is now reported
  # alongside ap either way so the skew is never silently hidden again.
  neg_ratio:    1.0
  n_folds:      5             # K in K-fold cross-validation

evaluation:
  top_k: [1, 5]                # Phase 2: Hit@K for next-component ranking

ranker:
  epochs:       30
  lr:           1.0e-3
  weight_decay: 1.0e-5
  n_per_graph:  5              # leave-one-node-out samples per graph per epoch
  fold_idx:     0

shape_gen:
  voxel_res:      32
  latent_dim:     128
  cond_dim:       77
  epochs:         60
  lr:             1.0e-3
  beta_kl:        0.05
  lambda_dice:    0.5
  n_per_graph:    8
  retrieval_tau:  0.6        # below this fit_score, fall back to VAE
  retrieval_tau_fastener: 0.4  # bolt/nut/washer only — accept a real part-bank
                                # match more readily; the bank already has
                                # hundreds of real fastener examples, and a
                                # slightly-imperfect real one usually beats a
                                # VAE hallucination for these standardized shapes
  part_bank_dir:  "data/part_bank"

paths:
  checkpoints:    "checkpoints"
  results:        "results"
  trained_models: "../trained_models"   # timestamped exports saved here
