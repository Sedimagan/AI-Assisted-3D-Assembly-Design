data:
  source_dir: "/Users/mbp/Documents/MTECH/Sem4/Individual_project/AI_Assisted_3D_Assembly_Design/AI-Assisted-3D-Assembly-Design/Source_3d_models/Best_models_for_training"
  processed_dir: "data/processed"
  train_ratio: 0.70
  val_ratio:   0.15
  test_ratio:  0.15
  mask_ratio:  [0.20, 0.40]   # fraction of edges masked per graph for partial-graph training
  categories:
    - "Bench_vice"
    - "C_Clamps"
    - "Pipe_vice"
    - "Gate_Valve"
    - "Press_Tool"
    - "Tool_Post"
    - "Crane_hook"

model:
  in_dim:     22              # node feature dimension (22-dim: 8 type + log-vol + log-SA + 3 bbox + 5 affine-invariant shape + SDF-mean + SDF-var + SA/V + log-holes)
  edge_dim:   6               # edge feature dimension (2 mate + 4 joint-type one-hot)
  hidden_dim: 128
  out_dim:    64
  heads:      [8, 4, 1]       # attention heads per GAT layer
  dropout:    0.2

training:
  batch_size:   16
  epochs:       200
  lr:           1.0e-3
  weight_decay: 5.0e-4
  patience:     20            # early stopping patience
  lr_patience:  8             # ReduceLROnPlateau patience
  lr_factor:    0.5
  neg_ratio:    0.5           # negatives per positive edge (hard negatives via P4 cover the rest)
  n_folds:      5             # K in K-fold cross-validation

evaluation:
  top_k: [1, 5]                # Phase 2: Hit@K for next-component ranking

ranker:
  epochs:       30
  lr:           1.0e-3
  weight_decay: 1.0e-5
  n_per_graph:  5              # leave-one-node-out samples per graph per epoch
  fold_idx:     0

shape_gen:
  voxel_res:      32
  latent_dim:     128
  cond_dim:       77
  epochs:         60
  lr:             1.0e-3
  beta_kl:        0.05
  lambda_dice:    0.5
  n_per_graph:    8
  retrieval_tau:  0.6        # below this fit_score, fall back to VAE
  part_bank_dir:  "data/part_bank"

paths:
  checkpoints:    "checkpoints"
  results:        "results"
  trained_models: "../trained_models"   # timestamped exports saved here
